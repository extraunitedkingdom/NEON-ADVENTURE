<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON ADVENTURE</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#101329;color:#fff;font-family:sans-serif;text-align:center}
h1{color:#16e0bd;margin:8px 0}
p{margin:8px}
canvas{display:block;width:100%;max-width:900px;height:auto;margin:12px auto;background:#171b3a;border:2px solid #16e0bd;border-radius:10px;touch-action:none}
button{background:#5743b8;color:white;border:2px solid #9b8aff;border-radius:12px;padding:12px 16px;margin:4px;font-size:16px;font-weight:bold;touch-action:manipulation}
.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
#actions{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;max-width:900px;margin:8px auto}
#home{position:relative;isolation:isolate;overflow:hidden;max-width:1000px;min-height:560px;margin:12px auto;padding:24px 18px 30px;border:1px solid #27eaff;border-radius:22px;background:radial-gradient(ellipse at 50% 22%,#343b91 0%,#171b48 42%,#080b20 100%);box-shadow:0 0 24px #00d9ff88,inset 0 0 35px #713dff55}
#home:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 12% 22%,#fff 0 1px,transparent 2px),radial-gradient(circle at 82% 18%,#53f6ff 0 2px,transparent 3px),radial-gradient(circle at 24% 75%,#b54cff 0 3px,transparent 4px),radial-gradient(circle at 91% 68%,#fff 0 1px,transparent 2px),linear-gradient(135deg,transparent 35%,#00d9ff22 50%,transparent 65%)}
#home h2{margin:4px 0 0;color:#7dfaff;font-size:13px;letter-spacing:5px}
#home .hero-character{font-size:clamp(76px,14vw,132px);line-height:1.25;margin:4px auto 0;filter:drop-shadow(0 0 16px #27eaff)}
#home .hero-title{margin:-8px auto 14px;font-size:clamp(34px,7vw,68px);font-weight:1000;font-style:italic;letter-spacing:-2px;line-height:.95;color:#fff;text-shadow:3px 3px 0 #7b2cff,-3px -2px 0 #00dfff,0 0 24px #00dfff}
#home .hero-subtitle{margin:12px 0 18px;color:#b9faff;letter-spacing:3px;font-size:12px}
#home .home-buttons{max-width:360px;margin:0 auto}
#home button{display:block;width:100%;margin:9px 0;padding:13px 16px;border-radius:12px;border:2px solid #58efff;background:linear-gradient(90deg,#112b62,#29206c);box-shadow:0 0 13px #00dfff77;color:#fff;letter-spacing:1px}
#home button:nth-child(2){border-color:#e17cff;background:linear-gradient(90deg,#3c1b67,#6a267a)}
#home button:nth-child(3){border-color:#5affd0;background:linear-gradient(90deg,#104d55,#126a59)}
#home button:nth-child(4){border-color:#ffd85a;background:linear-gradient(90deg,#694312,#856018)}
@media(max-width:700px){#home{min-height:500px;padding:18px 14px 22px;margin:4px auto}#home .hero-character{margin-top:16px}#home .hero-title{font-size:clamp(34px,10vw,54px)}}
#stage{display:none}\n.stage-top{max-width:900px;margin:8px auto;display:flex;align-items:center;justify-content:space-between;gap:8px}\n.stage-top p{margin:4px;font-weight:bold}\n#homeButton{padding:7px 12px;margin:0;font-size:13px;border-color:#58efff;background:#112b62;box-shadow:0 0 10px #00dfff55}\n@media(max-width:700px){.stage-top{padding:0 4px}}
@media(max-width:700px){#actions{gap:3px}#actions button{padding:10px 12px;font-size:14px}.controls button{min-width:28%;padding:14px 8px}}
#shopPanel{display:none;max-width:360px;margin:10px auto;padding:12px;background:#201a38;border:2px solid #9b8aff;border-radius:12px}
#shopPanel button{display:block;width:100%;margin:6px 0}
.small{font-size:13px;color:#c8c9df}
</style>
</head>
<body>
<h1>NEON ADVENTURE</h1>
<div id="home">
<h2>WELCOME TO THE WORLD</h2>
<div class="hero-character" aria-hidden="true">🧑🏻‍🚀⚔️</div>
<div class="hero-title">NEON<br>ADVENTURE</div>
<p class="hero-subtitle">✦ EXPLORE THE UNKNOWN ✦</p>
<div class="home-buttons">
<button id="startGame">▶　START GAME</button>
<button id="shopToggle">🛒　SKIN SHOP</button>
<button id="save">▣　SAVE</button>
<button id="ranking">🏆　RANKING</button>
</div>
<div id="shopPanel"><b>SKIN SHOP</b><div id="skinItems"></div></div>
</div>
<div id="stage">
<p>WORLD 1 : GREEN FOREST</p>
<canvas id="game" width="900" height="500"></canvas>
<p class="small">移動：← → / A・D　ジャンプ：Space　ダッシュ：左Ctrl</p>
<div class="controls">
<button id="left">◀ LEFT</button><button id="jump">JUMP ▲</button><button id="right">RIGHT ▶</button>
</div>
<div id="actions">
<button id="attack">ATTACK</button><button id="dash">DASH</button><button id="restart">RESTART</button>
</div>
<p class="small">敵は踏んで倒すか、ATTACKで倒そう。ボスを倒すとゴールできるよ。</p>
</div>
<script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const W=canvas.width,H=canvas.height;
const player={x:80,y:200,w:30,h:42,vx:0,vy:0,speed:4,jumpPower:11,jumps:0,maxJumps:2,grounded:false};
let playerHP=3,invincibleTimer=0,attackCooldown=0,dashTimer=0,shieldTimer=0;
let facing=1,attackTimer=0,gameStarted=false;
let playerSkin="#9b8aff",coinCount=0,camera=0,gameClear=false,bossDefeated=false,stageCleared=false;
let gameStart=Date.now(),currentTime=0;
let bestTime=Number(localStorage.getItem("bestTime"))||null;
let timeRecords=[];
try{timeRecords=JSON.parse(localStorage.getItem("timeRecords")||"[]");if(!Array.isArray(timeRecords))timeRecords=[]}catch(e){timeRecords=[]}
const keys={},touch={left:false,right:false};
const platforms=[
{x:0,y:430,w:500,h:70},{x:560,y:380,w:180,h:25},{x:800,y:330,w:180,h:25},
{x:1050,y:390,w:180,h:25},{x:1300,y:330,w:180,h:25},{x:1550,y:280,w:180,h:25},
{x:1800,y:350,w:250,h:100},{x:2150,y:300,w:180,h:25},{x:2450,y:350,w:350,h:100}
];
const enemies=[
{x:650,y:350,w:30,h:30,min:600,max:700,dir:1,alive:true},
{x:1100,y:360,w:30,h:30,min:1050,max:1200,dir:-1,alive:true},
{x:1900,y:320,w:30,h:30,min:1850,max:2000,dir:1,alive:true}
];
const coins=[
{x:300,y:395,taken:false},{x:650,y:340,taken:false},{x:900,y:290,taken:false},
{x:1150,y:350,taken:false},{x:1400,y:290,taken:false},{x:1650,y:240,taken:false},{x:2250,y:260,taken:false}
];
const goal={x:2650,y:270,w:45,h:80};
const boss={x:2500,y:270,w:80,h:80,hp:10,maxHP:10,alive:true};
const skins=[
{name:"NEON BLUE",color:"#00cfff",price:5},{name:"FIRE RED",color:"#ff4545",price:10},
{name:"GOLD",color:"#ffd700",price:20},{name:"MINT",color:"#16e0bd",price:30}
];
let ownedSkins=["#9b8aff"];
function saveGame(){
 const data={coinCount,stageCleared,bestTime,timeRecords,player:{x:player.x,y:player.y},playerHP,playerSkin,ownedSkins,coins:coins.map(c=>c.taken),enemyAlive:enemies.map(e=>e.alive),bossHP:boss.hp,bossAlive:boss.alive,bossDefeated,gameClear,currentTime};
 try{localStorage.setItem("gameSave",JSON.stringify(data))}catch(e){}
}
function loadGame(){
 try{
  const d=JSON.parse(localStorage.getItem("gameSave")||"null");if(!d)return;
  coinCount=d.coinCount??coinCount;stageCleared=!!d.stageCleared;bestTime=d.bestTime??bestTime;timeRecords=Array.isArray(d.timeRecords)?d.timeRecords:timeRecords;
  if(d.player){player.x=d.player.x??player.x;player.y=d.player.y??player.y}
  playerHP=d.playerHP??playerHP;playerSkin=d.playerSkin??playerSkin;
  ownedSkins=Array.isArray(d.ownedSkins)?d.ownedSkins:ownedSkins;
  if(Array.isArray(d.coins))coins.forEach((c,i)=>c.taken=!!d.coins[i]);
  if(Array.isArray(d.enemyAlive))enemies.forEach((e,i)=>e.alive=d.enemyAlive[i]!==false);
  boss.hp=d.bossHP??boss.hp;boss.alive=d.bossAlive??boss.alive;bossDefeated=!!d.bossDefeated;
  gameClear=!!d.gameClear;currentTime=d.currentTime??0;
  if(gameClear)gameStart=Date.now()-currentTime*1000;
 }catch(e){console.warn("セーブデータを読み込めませんでした",e)}
}
function jump(){if(!gameClear&&player.jumps<player.maxJumps){player.vy=-player.jumpPower;player.jumps++;player.grounded=false}}
function attack(){
 if(gameClear||attackCooldown>0)return;
 attackCooldown=20;attackTimer=12;
 for(const e of enemies){if(e.alive&&Math.hypot(player.x+player.w/2-(e.x+e.w/2),player.y+player.h/2-(e.y+e.h/2))<75)e.alive=false}
 if(boss.alive&&Math.hypot(player.x+player.w/2-(boss.x+boss.w/2),player.y+player.h/2-(boss.y+boss.h/2))<115){
  boss.hp=Math.max(0,boss.hp-1);if(boss.hp===0){boss.alive=false;bossDefeated=true;saveGame()}
 }
}
function useDash(){if(gameStarted&&!gameClear&&dashTimer===0)dashTimer=90}
function useShield(){if(!gameClear&&shieldTimer===0){shieldTimer=120;invincibleTimer=Math.max(invincibleTimer,120)}}
function bindHold(id,side){
 const el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{e.preventDefault();touch[side]=true});
 for(const ev of ["pointerup","pointerleave","pointercancel"])el.addEventListener(ev,()=>touch[side]=false);
}
bindHold("left","left");bindHold("right","right");
document.getElementById("jump").addEventListener("pointerdown",e=>{e.preventDefault();jump()});
document.getElementById("attack").addEventListener("pointerdown",e=>{e.preventDefault();attack()});
document.getElementById("dash").onclick=useDash;

window.addEventListener("keydown",e=>{keys[e.code]=true;if(e.code==="Space"&&!e.repeat){e.preventDefault();jump()}if(e.code==="ControlLeft"&&!e.repeat){e.preventDefault();useDash()}});
window.addEventListener("keyup",e=>keys[e.code]=false);
canvas.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.button===0)attack()});
function finishGame(){
 if(gameClear)return;
 gameClear=true;stageCleared=true;currentTime=(Date.now()-gameStart)/1000;
 if(bestTime===null||currentTime<bestTime){bestTime=currentTime;localStorage.setItem("bestTime",String(bestTime))}
 timeRecords.push(currentTime);timeRecords.sort((a,b)=>a-b);timeRecords=timeRecords.slice(0,5);
 localStorage.setItem("timeRecords",JSON.stringify(timeRecords));saveGame();
 setTimeout(()=>alert("WORLD 1 CLEAR! TIME: "+currentTime.toFixed(2)+"秒"),50);
}
function update(){
 if(!gameClear){
  if(dashTimer>0)dashTimer--;if(shieldTimer>0)shieldTimer--;if(invincibleTimer>0)invincibleTimer--;if(attackCooldown>0)attackCooldown--;if(attackTimer>0)attackTimer--;
  const speed=dashTimer>0?player.speed*2:player.speed;
  const left=keys.ArrowLeft||keys.KeyA||touch.left,right=keys.ArrowRight||keys.KeyD||touch.right;
  player.vx=(right?speed:0)-(left?speed:0);if(player.vx!==0)facing=player.vx>0?1:-1;player.x=Math.max(0,player.x+player.vx);
  const oldY=player.y;player.vy+=0.5;player.y+=player.vy;player.grounded=false;
  for(const p of platforms){if(player.vy>=0&&oldY+player.h<=p.y&&player.y+player.h>=p.y&&player.x+player.w>p.x&&player.x<p.x+p.w){player.y=p.y-player.h;player.vy=0;player.grounded=true;player.jumps=0}}
  if(player.y>650){player.x=80;player.y=200;player.vx=0;player.vy=0;player.jumps=0;playerHP=Math.max(1,playerHP-1);invincibleTimer=60}
  for(const e of enemies){
   if(!e.alive)continue;e.x+=e.dir*1.5;if(e.x<e.min||e.x>e.max)e.dir*=-1;
   if(player.x<e.x+e.w&&player.x+player.w>e.x&&player.y<e.y+e.h&&player.y+player.h>e.y){
    if(player.vy>0&&oldY+player.h<=e.y+16){e.alive=false;player.vy=-8;player.jumps=1}
    else if(invincibleTimer===0){playerHP--;invincibleTimer=60;player.vy=-5;if(playerHP<=0){playerHP=3;player.x=80;player.y=200;player.vy=0;player.jumps=0}}
   }
  }
  for(const c of coins){if(!c.taken&&player.x<c.x+15&&player.x+player.w>c.x-15&&player.y<c.y+15&&player.y+player.h>c.y-15){c.taken=true;coinCount++}}
  if(boss.alive&&player.x<boss.x+boss.w&&player.x+player.w>boss.x&&player.y<boss.y+boss.h&&player.y+player.h>boss.y&&invincibleTimer===0){playerHP--;invincibleTimer=60;player.vy=-5;if(playerHP<=0){playerHP=3;player.x=80;player.y=200;player.vy=0;player.jumps=0}}
  if(bossDefeated&&player.x<goal.x+goal.w&&player.x+player.w>goal.x&&player.y<goal.y+goal.h&&player.y+player.h>goal.y)finishGame();
  camera=Math.max(0,Math.min(1900,player.x-250));
 }
 draw();requestAnimationFrame(update);
}
function draw(){
 ctx.clearRect(0,0,W,H);
 const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#16294b");bg.addColorStop(1,"#0c1024");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 ctx.save();ctx.translate(-camera,0);
 // 遠景の森
 for(let i=0;i<24;i++){const x=i*150;ctx.fillStyle=i%2?"#173d42":"#1c5147";ctx.beginPath();ctx.arc(x+45,370,85,Math.PI,0);ctx.fill()}
 for(const p of platforms){ctx.fillStyle="#294b3c";ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle="#42d68b";ctx.fillRect(p.x,p.y,p.w,6)}
 for(const c of coins){if(c.taken)continue;ctx.fillStyle="#ffd700";ctx.beginPath();ctx.arc(c.x,c.y,9,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff0a0";ctx.stroke()}
 for(const e of enemies){if(!e.alive)continue;ctx.fillStyle="#ff477e";ctx.fillRect(e.x,e.y,e.w,e.h);ctx.fillStyle="white";ctx.fillRect(e.x+6,e.y+8,5,5);ctx.fillRect(e.x+19,e.y+8,5,5)}
 if(boss.alive){ctx.fillStyle="#9b35ff";ctx.fillRect(boss.x,boss.y,boss.w,boss.h);ctx.fillStyle="#fff";ctx.fillRect(boss.x+18,boss.y+20,10,10);ctx.fillRect(boss.x+52,boss.y+20,10,10)}
 if(bossDefeated){ctx.fillStyle="#ffd700";ctx.fillRect(goal.x,goal.y,goal.w,goal.h);ctx.fillStyle="#fff";ctx.font="16px sans-serif";ctx.fillText("GOAL",goal.x-4,goal.y-10)}
 ctx.shadowColor=playerSkin;ctx.shadowBlur=15;ctx.fillStyle=playerSkin;ctx.fillRect(player.x,player.y,player.w,player.h);ctx.shadowBlur=0;
 ctx.fillStyle="white";ctx.fillRect(player.x+19,player.y+9,5,5);ctx.fillStyle="#16e0bd";ctx.fillRect(player.x+4,player.y+player.h-5,22,5);
 if(attackTimer>0){
  const progress=1-attackTimer/12;
  const handX=player.x+player.w/2+facing*9,handY=player.y+19;
  const start=-1.15+progress*1.8,end=start+0.9;
  ctx.save();ctx.lineCap="round";
  ctx.strokeStyle="rgba(80,245,255,0.35)";ctx.lineWidth=13;
  ctx.beginPath();ctx.arc(handX,handY,43,start*facing,end*facing,false);ctx.stroke();
  ctx.strokeStyle="#bdfcff";ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(handX,handY);
  ctx.lineTo(handX+Math.cos((start+0.45)*facing)*48,handY+Math.sin((start+0.45)*facing)*48);
  ctx.stroke();
  ctx.strokeStyle="#ffffff";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(handX,handY);
  ctx.lineTo(handX+Math.cos((start+0.45)*facing)*48,handY+Math.sin((start+0.45)*facing)*48);
  ctx.stroke();ctx.restore();
 }
 ctx.restore();
 ctx.fillStyle="white";ctx.font="bold 19px sans-serif";ctx.fillText("WORLD 1 : GREEN FOREST",18,28);
 ctx.font="16px sans-serif";ctx.fillStyle="#ffd700";ctx.fillText("COINS: "+coinCount,18,58);
 ctx.fillStyle="#00ffff";ctx.fillText("TIME: "+(gameClear?currentTime:(Date.now()-gameStart)/1000).toFixed(2),18,84);
 ctx.fillStyle="#ffd700";ctx.fillText("BEST: "+(bestTime===null?"--":bestTime.toFixed(2)+"s"),18,110);
 ctx.fillStyle="white";ctx.fillText("HP: "+"♥".repeat(playerHP),18,138);
 ctx.fillStyle="#fff";ctx.font="14px sans-serif";ctx.fillText("DOUBLE JUMP: "+(player.jumps<2?"READY":"USED"),18,164);
 if(boss.alive){ctx.fillStyle="#555";ctx.fillRect(300,20,300,16);ctx.fillStyle="#ff477e";ctx.fillRect(300,20,300*(boss.hp/boss.maxHP),16);ctx.fillStyle="white";ctx.fillText("BOSS",300,15)}
 if(gameClear){ctx.fillStyle="rgba(0,0,0,.65)";ctx.fillRect(0,0,W,H);ctx.fillStyle="#ffd700";ctx.font="bold 42px sans-serif";ctx.fillText("WORLD 1 CLEAR!",W/2-165,H/2);ctx.font="20px sans-serif";ctx.fillStyle="white";ctx.fillText("TIME "+currentTime.toFixed(2)+"s",W/2-65,H/2+40)}
}
function restart(){
 player.x=80;player.y=200;player.vx=0;player.vy=0;player.jumps=0;playerHP=3;coinCount=0;
 coins.forEach(c=>c.taken=false);enemies.forEach(e=>e.alive=true);boss.hp=boss.maxHP;boss.alive=true;bossDefeated=false;
 gameClear=false;gameStarted=true;currentTime=0;gameStart=Date.now();camera=0;dashTimer=0;shieldTimer=0;invincibleTimer=0;attackTimer=0;saveGame();
}
document.getElementById("restart").onclick=()=>{restart()};\ndocument.getElementById("homeButton").onclick=()=>{saveGame();gameStarted=false;touch.left=false;touch.right=false;keys.ArrowLeft=keys.ArrowRight=keys.KeyA=keys.KeyD=false;document.getElementById("stage").style.display="none";document.getElementById("home").style.display="block"};
document.getElementById("startGame").onclick=()=>{gameStarted=true;document.getElementById("home").style.display="none";document.getElementById("stage").style.display="block";gameStart=Date.now()-currentTime*1000};
document.getElementById("save").onclick=()=>{saveGame();alert("GAME SAVED!")};
document.getElementById("ranking").onclick=()=>alert("TIME RANKING TOP 5\n\n"+(timeRecords.length?timeRecords.map((t,i)=>(i+1)+"位 : "+t.toFixed(2)+"秒").join("\n"):"まだ記録がありません"));
document.getElementById("shopToggle").onclick=()=>{const p=document.getElementById("shopPanel");p.style.display=p.style.display==="block"?"none":"block"};
function renderShop(){
 const area=document.getElementById("skinItems");area.innerHTML="";
 for(const s of skins){const b=document.createElement("button");b.textContent=s.name+" - "+s.price+" COINS";
 b.onclick=()=>{if(ownedSkins.includes(s.color)){playerSkin=s.color;saveGame();alert("スキンを装備した！")}else if(coinCount>=s.price){coinCount-=s.price;ownedSkins.push(s.color);playerSkin=s.color;saveGame();alert("スキンを購入した！")}else alert("コインが足りない！")};area.appendChild(b)}
}
renderShop();loadGame();setInterval(()=>{if(gameStarted)saveGame()},5000);update();
</script>
</body>
</html>
