<style>

@media(max-width:700px){.stage-top{padding:0 4px}}
.stage-top{max-width:900px;margin:8px auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.stage-top p{margin:4px;font-weight:bold}

#stageSelect{display:none;max-width:390px;margin:12px auto;padding:12px;background:#171b48;border:2px solid #27eaff;border-radius:14px}#stageSelect button{display:block;width:100%;margin:8px 0}#world2Select{border-color:#ff8a36;background:linear-gradient(90deg,#6b2417,#9b4b20)}

</style>
</head>
<body>
<h1>NEON ADVENTURE</h1>
<div id="home">
<h2>WELCOME TO THE WORLD</h2>
<div class="hero-character" aria-hidden="true">🧑🏻‍🚀⚔️</div>
<div class="hero-title">NEON<br>ADVENTURE</div>
<p class="hero-subtitle">✦ EXPLORE THE UNKNOWN ✦</p>
<div class="home-buttons">
<button id="startGame">▶　STAGE SELECT</button>
<div id="stageSelect"><b>SELECT WORLD</b><button id="world1Select">🌿 WORLD 1 : GREEN FOREST</button><button id="world2Select" disabled>🌋 WORLD 2 : LAVA LAND 🔒</button><button id="world3Select" disabled>☁️ WORLD 3 : SKY KINGDOM 🔒</button></div>

</div>
<div id="stage">
<div class="stage-top"><p>WORLD 1 : GREEN FOREST</p><button id="homeButton" type="button">⌂ HOME</button></div>
<canvas id="game" width="900" height="500"></canvas>

</div>

</div>
<p class="small">敵は踏んで倒すか、ATTACKで倒そう。ボスを倒すとゴールできるよ。</p><p class="small" id="world2Hint">WORLD 2：水色のジャンプパッドでマグマを飛び越えよう。2つ目は高い壁の上へ飛び乗るためのパッド！</p>
</div>
<script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const W=canvas.width,H=canvas.height;
const player={x:80,y:200,w:30,h:42,vx:0,vy:0,speed:4,jumpPower:11,jumps:0,maxJumps:2,grounded:false};
let playerHP=3,invincibleTimer=0,attackCooldown=0,dashTimer=0,shieldTimer=0;
let worldNumber=1,world2Unlocked=false,world2Cleared=false,world3Unlocked=false,world3Cleared=false;
let facing=1,attackTimer=0,gameStarted=false;
let playerSkin="#9b8aff",coinCount=0,camera=0,gameClear=false,bossDefeated=false,stageCleared=false;
let gameStart=Date.now(),currentTime=0;
let bestTime=Number(localStorage.getItem("bestTime"))||null;
let timeRecords=[];
try{timeRecords=JSON.parse(localStorage.getItem("timeRecords")||"[]");if(!Array.isArray(timeRecords))timeRecords=[]}catch(e){timeRecords=[]}
const keys={},touch={left:false,right:false};
let platforms=[
{x:0,y:430,w:500,h:70},{x:560,y:380,w:180,h:25},{x:800,y:330,w:180,h:25},
{x:1050,y:390,w:180,h:25},{x:1300,y:330,w:180,h:25},{x:1550,y:280,w:180,h:25},
{x:1800,y:350,w:250,h:100},{x:2150,y:300,w:180,h:25},{x:2450,y:350,w:350,h:100}
];
let enemies=[
{x:650,y:350,w:30,h:30,min:600,max:700,dir:1,alive:true},
{x:1100,y:360,w:30,h:30,min:1050,max:1200,dir:-1,alive:true},
{x:1900,y:320,w:30,h:30,min:1850,max:2000,dir:1,alive:true}
];
let coins=[
{x:300,y:395,taken:false},{x:650,y:340,taken:false},{x:900,y:290,taken:false},
{x:1150,y:350,taken:false},{x:1400,y:290,taken:false},{x:1650,y:240,taken:false},{x:2250,y:260,taken:false}
];
let goal={x:2650,y:270,w:45,h:80};
let boss={x:2500,y:270,w:80,h:80,hp:10,maxHP:10,alive:true};
let lavaZones=[];
let springPads=[];
let stageWalls=[];
let windZones=[],movingPlatforms=[],vanishPlatforms=[],lightningZones=[];
function loadWorld2(){
 worldNumber=2;springPads=[{x:470,y:410,w:54,h:20,power:17},{x:1320,y:410,w:58,h:20,power:21}];stageWalls=[{x:1700,y:170,w:70,h:260}];player.x=80;player.y=350;player.vx=0;player.vy=0;player.jumps=0;playerHP=3;camera=0;
 // 基本は平地。マグマ溜まりをジャンプパッドで越え、最後は高い壁を飛び乗る構成
 platforms=[{x:0,y:430,w:470,h:70},{x:570,y:430,w:750,h:70},{x:1420,y:430,w:280,h:70},{x:1770,y:170,w:90,h:25},{x:1860,y:300,w:500,h:130},{x:2360,y:430,w:430,h:70}];
 lavaZones=[{x:470,y:455,w:100,h:45},{x:1320,y:455,w:100,h:45},{x:1700,y:455,w:60,h:45},{x:2290,y:455,w:70,h:45}];
 enemies=[{x:760,y:400,w:32,h:30,min:650,max:1000,dir:1,alive:true},{x:1120,y:400,w:32,h:30,min:1050,max:1270,dir:-1,alive:true},{x:1930,y:270,w:34,h:30,min:1880,max:2250,dir:1,alive:true},{x:2450,y:400,w:36,h:30,min:2400,max:2700,dir:-1,alive:true}];
 coins=[{x:330,y:385,taken:false},{x:520,y:345,taken:false},{x:820,y:385,taken:false},{x:1120,y:385,taken:false},{x:1370,y:345,taken:false},{x:1660,y:330,taken:false},{x:1815,y:125,taken:false},{x:2050,y:255,taken:false},{x:2250,y:255,taken:false},{x:2510,y:385,taken:false}];
 goal={x:2700,y:350,w:45,h:80};boss={x:2580,y:350,w:80,h:80,hp:14,maxHP:14,alive:true};bossDefeated=false;gameClear=false;stageCleared=false;currentTime=0;gameStart=Date.now();
 document.querySelector(".stage-top p").textContent="WORLD 2 : LAVA LAND";
}
const skins=[
{name:"NEON BLUE",color:"#00cfff",price:5},{name:"FIRE RED",color:"#ff4545",price:10},
{name:"GOLD",color:"#ffd700",price:20},{name:"MINT",color:"#16e0bd",price:30}
];
let ownedSkins=["#9b8aff"];
function saveGame(){
 const data={worldNumber,world2Unlocked,world2Cleared,world3Unlocked,world3Cleared,coinCount,stageCleared,bestTime,timeRecords,player:{x:player.x,y:player.y},playerHP,playerSkin,ownedSkins,coins:coins.map(c=>c.taken),enemyAlive:enemies.map(e=>e.alive),bossHP:boss.hp,bossAlive:boss.alive,bossDefeated,gameClear,currentTime};
 try{localStorage.setItem("gameSave",JSON.stringify(data))}catch(e){}
}
function loadGame(){
 try{
  const d=JSON.parse(localStorage.getItem("gameSave")||"null");if(!d)return;
  coinCount=d.coinCount??coinCount;worldNumber=d.worldNumber??worldNumber;world2Unlocked=!!d.world2Unlocked;world2Cleared=!!d.world2Cleared;world3Unlocked=!!d.world3Unlocked;world3Cleared=!!d.world3Cleared;stageCleared=!!d.stageCleared;bestTime=d.bestTime??bestTime;timeRecords=Array.isArray(d.timeRecords)?d.timeRecords:timeRecords;
  if(d.player){player.x=d.player.x??player.x;player.y=d.player.y??player.y}
  playerHP=d.playerHP??playerHP;playerSkin=d.playerSkin??playerSkin;
  ownedSkins=Array.isArray(d.ownedSkins)?d.ownedSkins:ownedSkins;
  if(Array.isArray(d.coins))coins.forEach((c,i)=>c.taken=!!d.coins[i]);
  if(Array.isArray(d.enemyAlive))enemies.forEach((e,i)=>e.alive=d.enemyAlive[i]!==false);
  boss.hp=d.bossHP??boss.hp;boss.alive=d.bossAlive??boss.alive;bossDefeated=!!d.bossDefeated;
  gameClear=!!d.gameClear;currentTime=d.currentTime??0;
  if(gameClear)gameStart=Date.now()-currentTime*1000;
 }catch(e){console.warn("セーブデータを読み込めませんでした",e)}
}
function loadWorld3(){
 worldNumber=3;springPads=[];lavaZones=[];stageWalls=[];
 // 風で上昇→浮島を渡る→雷を見て通過→消える足場を登る→風で城へ
 windZones=[{x:350,y:115,w:220,h:315,dir:1,power:1.35},{x:2580,y:70,w:230,h:360,dir:1,power:1.35}];
 movingPlatforms=[
  // 通常ジャンプでは届かない間隔。床が互いに近づくタイミングを待って渡る
  {x:690,y:350,w:125,h:18,baseX:690,baseY:350,range:105,speed:0.0038,phase:0},
  {x:1000,y:295,w:125,h:18,baseX:1000,baseY:295,range:105,speed:0.0038,phase:Math.PI},
  {x:1310,y:345,w:130,h:18,baseX:1310,baseY:345,range:105,speed:0.0038,phase:0}
 ];
 vanishPlatforms=[{x:1950,y:365,w:110,h:18,timer:0,active:true},{x:2100,y:305,w:110,h:18,timer:0,active:true},{x:2250,y:245,w:110,h:18,timer:0,active:true},{x:2400,y:185,w:120,h:18,timer:0,active:true}];
 lightningZones=[{x:1580,y:165,w:62,h:265,period:190,phase:0},{x:1760,y:165,w:62,h:265,period:190,phase:95},{x:2470,y:80,w:58,h:350,period:165,phase:35}];
 platforms=[
  {x:0,y:430,w:350,h:70},{x:570,y:430,w:90,h:22},
  {x:1480,y:390,w:105,h:40},{x:1660,y:430,w:180,h:70},
  {x:1840,y:430,w:100,h:70},{x:2530,y:430,w:100,h:70},
  {x:2820,y:270,w:150,h:22},{x:2990,y:430,w:390,h:70}
 ];
 enemies=[{x:1690,y:395,w:32,h:30,min:1660,max:1810,dir:1,alive:true},{x:3020,y:395,w:34,h:30,min:2990,max:3300,dir:-1,alive:true}];
 coins=[{x:290,y:370,taken:false},{x:760,y:310,taken:false},{x:1190,y:250,taken:false},{x:1510,y:350,taken:false},{x:1880,y:370,taken:false},{x:2180,y:210,taken:false},{x:2450,y:145,taken:false},{x:2870,y:230,taken:false},{x:3200,y:370,taken:false}];
 goal={x:3330,y:350,w:45,h:80};boss={x:3160,y:350,w:80,h:80,hp:18,maxHP:18,alive:true};
 player.x=80;player.y=350;player.vx=0;player.vy=0;player.jumps=0;playerHP=3;camera=0;bossDefeated=false;gameClear=false;stageCleared=false;currentTime=0;gameStart=Date.now();
 document.querySelector(".stage-top p").textContent="WORLD 3 : SKY KINGDOM";
}
function jump(){if(!gameClear&&player.jumps<player.maxJumps){player.vy=-player.jumpPower;player.jumps++;player.grounded=false}}
function attack(){
 if(gameClear||attackCooldown>0)return;
 attackCooldown=20;attackTimer=12;
 for(const e of enemies){if(e.alive&&Math.hypot(player.x+player.w/2-(e.x+e.w/2),player.y+player.h/2-(e.y+e.h/2))<75)e.alive=false}
 if(boss.alive&&Math.hypot(player.x+player.w/2-(boss.x+boss.w/2),player.y+player.h/2-(boss.y+boss.h/2))<115){
  boss.hp=Math.max(0,boss.hp-1);if(boss.hp===0){boss.alive=false;bossDefeated=true;saveGame()}
 }
}
function useDash(){if(gameStarted&&!gameClear&&dashTimer===0)dashTimer=90}
function useShield(){if(!gameClear&&shieldTimer===0){shieldTimer=120;invincibleTimer=Math.max(invincibleTimer,120)}}
function bindHold(id,side){
 const el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{e.preventDefault();touch[side]=true});
 for(const ev of ["pointerup","pointerleave","pointercancel"])el.addEventListener(ev,()=>touch[side]=false);
}
bindHold("left","left");bindHold("right","right");
document.getElementById("jump").addEventListener("pointerdown",e=>{e.preventDefault();jump()});
document.getElementById("attack").addEventListener("pointerdown",e=>{e.preventDefault();attack()});
document.getElementById("dash").onclick=useDash;

window.addEventListener("keydown",e=>{keys[e.code]=true;if(e.code==="Space"&&!e.repeat){e.preventDefault();jump()}if(e.code==="ControlLeft"&&!e.repeat){e.preventDefault();useDash()}});
window.addEventListener("keyup",e=>keys[e.code]=false);
canvas.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.button===0)attack()});
function finishGame(){
 if(gameClear)return;
 gameClear=true;stageCleared=true;if(worldNumber===1)world2Unlocked=true;else if(worldNumber===2){world2Cleared=true;world3Unlocked=true}else world3Cleared=true;currentTime=(Date.now()-gameStart)/1000;
 if(bestTime===null||currentTime<bestTime){bestTime=currentTime;localStorage.setItem("bestTime",String(bestTime))}
 timeRecords.push(currentTime);timeRecords.sort((a,b)=>a-b);timeRecords=timeRecords.slice(0,5);
 localStorage.setItem("timeRecords",JSON.stringify(timeRecords));saveGame();
 saveGame();document.getElementById("clearTitle").textContent="WORLD "+worldNumber+" CLEAR!";document.getElementById("clearPanel").style.display="block";document.getElementById("nextStageButton").style.display=worldNumber<3?"inline-block":"none";
}
function update(){
 if(gameStarted&&!gameClear){
  if(dashTimer>0)dashTimer--;if(shieldTimer>0)shieldTimer--;if(invincibleTimer>0)invincibleTimer--;if(attackCooldown>0)attackCooldown--;if(attackTimer>0)attackTimer--;
  const speed=dashTimer>0?player.speed*2:player.speed;
  const left=keys.ArrowLeft||keys.KeyA||touch.left,right=keys.ArrowRight||keys.KeyD||touch.right;
  player.vx=(right?speed:0)-(left?speed:0);if(player.vx!==0)facing=player.vx>0?1:-1;
  const oldX=player.x;player.x=Math.max(0,player.x+player.vx);
  for(const wall of stageWalls){if(player.y+player.h>wall.y&&player.y<wall.y+wall.h&&player.x+player.w>wall.x&&player.x<wall.x+wall.w){if(oldX+player.w<=wall.x)player.x=wall.x-player.w;else if(oldX>=wall.x+wall.w)player.x=wall.x+wall.w;player.vx=0}}
  const oldY=player.y;
  if(worldNumber===3&&player.ridingPlatform){const rp=player.ridingPlatform;if(rp.active!==false){player.x+=rp.x-(rp.prevX??rp.x);player.y+=rp.y-(rp.prevY??rp.y)}else player.ridingPlatform=null}
  for(const m of movingPlatforms){m.prevX=m.x;m.prevY=m.y;m.x=m.baseX+Math.sin(Date.now()*m.speed+m.phase)*m.range;m.y=m.baseY+Math.sin(Date.now()*m.speed*0.72+m.phase)*42;if(m.prevX===undefined)m.prevX=m.x;if(m.prevY===undefined)m.prevY=m.y}
  for(const v of vanishPlatforms){if(v.timer>0){v.timer--;if(v.timer===0){v.active=false;v.respawn=90}}else if(v.respawn>0){v.respawn--;if(v.respawn===0)v.active=true}}
  player.vy+=0.5;player.y+=player.vy;player.grounded=false;
  for(const w of windZones){if(player.x+player.w>w.x&&player.x<w.x+w.w&&player.y+player.h>w.y&&player.y<w.y+w.h){player.x+=w.dir*3.2;player.vy=Math.min(player.vy,-7.5);player.y-=1.8}}
  for(const p of [...platforms,...movingPlatforms,...vanishPlatforms.filter(v=>v.active)]){if(player.vy>=0&&oldY+player.h<=(p.prevY??p.y)+2&&player.y+player.h>=p.y&&player.x+player.w>p.x&&player.x<p.x+p.w){player.y=p.y-player.h;player.vy=0;player.grounded=true;player.jumps=0;player.ridingPlatform=(movingPlatforms.includes(p)?p:null);if(vanishPlatforms.includes(p)&&p.timer===0){p.timer=30;p.respawn=0}}}
  for(const l of lightningZones){l.phase=(l.phase+1)%l.period;if(l.phase<48&&player.x<l.x+l.w&&player.x+player.w>l.x&&player.y<l.y+l.h&&player.y+player.h>l.y&&invincibleTimer===0){playerHP--;invincibleTimer=75;player.vy=-6;if(playerHP<=0){playerHP=3;player.x=80;player.y=350;player.vy=0;player.jumps=0}}}
  if(worldNumber>=2&&player.vy>=0){for(const pad of springPads){if(oldY+player.h<=pad.y&&player.y+player.h>=pad.y&&player.x+player.w>pad.x&&player.x<pad.x+pad.w){player.y=pad.y-player.h;player.vy=-pad.power;player.jumps=1;player.grounded=false}}}
  if(player.y>650){player.x=80;player.y=200;player.vx=0;player.vy=0;player.jumps=0;player.ridingPlatform=null;playerHP=Math.max(1,playerHP-1);invincibleTimer=60}
  for(const z of lavaZones){if(player.x<z.x+z.w&&player.x+player.w>z.x&&player.y<z.y+z.h&&player.y+player.h>z.y&&invincibleTimer===0){playerHP--;invincibleTimer=60;player.vy=-7;if(playerHP<=0){playerHP=3;player.x=80;player.y=200;player.vy=0;player.jumps=0}}}
  for(const e of enemies){
   if(!e.alive)continue;e.x+=e.dir*1.5;if(e.x<e.min||e.x>e.max)e.dir*=-1;
   if(player.x<e.x+e.w&&player.x+player.w>e.x&&player.y<e.y+e.h&&player.y+player.h>e.y){
    if(player.vy>0&&oldY+player.h<=e.y+16){e.alive=false;player.vy=-8;player.jumps=1}
    else if(invincibleTimer===0){playerHP--;invincibleTimer=60;player.vy=-5;if(playerHP<=0){playerHP=3;player.x=80;player.y=200;player.vy=0;player.jumps=0}}
   }
  }
  for(const c of coins){if(!c.taken&&player.x<c.x+15&&player.x+player.w>c.x-15&&player.y<c.y+15&&player.y+player.h>c.y-15){c.taken=true;coinCount++}}

  if(bossDefeated&&player.x<goal.x+goal.w&&player.x+player.w>goal.x&&player.y<goal.y+goal.h&&player.y+player.h>goal.y)finishGame();
  camera=Math.max(0,Math.min(worldNumber===3?2500:1900,player.x-250));
 }
 draw();requestAnimationFrame(update);
}
